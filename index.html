<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit – concept demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --navy:#1a2440; --orange:#f5921b; --orange-soft:#fdeedd; --blue:#2b6cc4; --link:#1d6fb8;
  --line:#d8d8d8; --line-soft:#e8e8e8; --bg:#f4f4f4; --head:#ededed; --text:#222; --muted:#6b6b6b;
  --green:#3a9b3a; --green-soft:#e6f4e3; --amber:#b86e00; --amber-soft:#fff3d6; --red:#c0392b; --red-soft:#fbe6e3;
  --req:#fdf7c9; --purple:#6a4bc4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#333;-webkit-font-smoothing:antialiased;background:#fff;min-width:1240px}
a{color:var(--link);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
button,input,select{font:inherit} button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:normal}

/* ---------- demo strip ---------- */
.demobar{background:#0e1426;color:#b9c2d8;font-size:12px;display:flex;align-items:center;gap:6px;padding:5px 10px}
.demobar b{color:#fff;font-weight:normal;margin-right:6px}
.demobar button{background:none;border:1px solid #3a4666;color:#cfd6e6;border-radius:11px;padding:1px 11px}
.demobar button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:bold}
.demobar .sp{margin-left:auto}
.tourctl{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding-left:12px;border-left:1px solid #3a4666}.tourctl em{font-style:normal;color:#f7b65c;margin-right:2px}.demobar .tourctl .nx{background:var(--blue);border-color:var(--blue);color:#fff}.demobar button:disabled{opacity:.4;cursor:default}

/* ---------- Vault chrome ---------- */
.topbar{background:var(--navy);height:50px;display:flex;align-items:center;padding:0 16px;color:#fff;gap:16px}
.logo{display:flex;align-items:center;gap:6px;font-size:21px;white-space:nowrap}
.logo i{font-style:normal;opacity:.5;margin:0 6px}
.logo small{font-size:17px}
.search{margin:0 auto;position:relative;display:flex;background:#fff;border-radius:3px;width:620px;height:28px;color:#333}
.search .sel{width:150px;border-right:1px solid #ccc;padding:5px 9px;display:flex;justify-content:space-between;white-space:nowrap}
.search input{flex:1;border:0;outline:0;padding:0 9px;background:none;min-width:0}
.search .mag{padding:5px 9px;color:var(--orange)}
.results{position:absolute;top:31px;left:0;right:0;background:#fff;border:1px solid #bbb;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15;max-height:420px;overflow:auto}
.results h5{margin:0;padding:5px 10px;background:var(--head);font-size:11px;color:#555;text-transform:uppercase}
.results div.r{padding:6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;gap:8px}
.results div.r:hover{background:var(--orange-soft)}
.results div.r small{color:var(--muted);margin-left:auto;white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;background:#c9d3e6;color:var(--navy);display:grid;place-items:center;font-weight:bold;font-size:11px}
.nav{background:#f6f6f6;border-bottom:1px solid var(--line);height:38px;display:flex;align-items:center;padding:0 14px;gap:2px}
.nav span{padding:10px 12px 8px;border-bottom:3px solid transparent;color:#333;white-space:nowrap}
.nav span.on{color:var(--orange);border-bottom-color:var(--orange)}
.nav .create{margin-left:auto;background:var(--blue);color:#fff;border:1px solid #1f559f;border-radius:3px;padding:5px 12px;font-weight:bold}
.crumbs{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:15px}
.crumbs .sep{color:#555;font-weight:bold}
.crumbs .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
.env{color:#fff;border-radius:10px;padding:2px 10px;font-size:11px;font-weight:bold;letter-spacing:.3px;background:var(--green)}
.env.dev{background:#555}
.layout{display:flex;align-items:flex-start;border-top:1px solid var(--line-soft)}
aside{width:212px;flex:none;background:var(--bg);border-right:1px solid var(--line);min-height:calc(100vh - 158px);padding-bottom:20px}
aside h3{font-size:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
aside h4{padding:12px 16px 4px;font-size:13px;color:#666;text-transform:uppercase}
aside .it{padding:6px 16px;border-left:3px solid transparent;cursor:pointer}
aside .it:hover{background:#ececec}
aside .it.off{color:#888;cursor:default} aside .it.off:hover{background:none}
aside .it.on{color:var(--orange);border-left-color:var(--orange)}
aside hr{border:0;border-top:1px solid var(--line);margin:10px 0 0}
.new{font-size:9px;background:var(--purple);color:#fff;border-radius:2px;padding:0 4px;margin-left:4px;vertical-align:1px}
main{flex:1;min-width:0;padding:14px 18px 60px}

/* ---------- shared widgets ---------- */
.ph{display:flex;align-items:center;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--orange);margin-bottom:12px}
.ph h1{font-size:20px;font-weight:bold}
.ph .sub{color:var(--muted);font-size:12px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:linear-gradient(#fff,#ececec);border:1px solid #bdbdbd;border-radius:3px;padding:5px 12px;color:#222;white-space:nowrap}
.btn:hover{background:#e9e9e9}
.btn.pri{background:var(--blue);border-color:#1f559f;color:#fff;font-weight:bold}
.btn.pri:hover{background:#245eac}
.btn.ok{background:var(--green);border-color:#2c7c2c;color:#fff;font-weight:bold}
.btn.org{background:var(--orange);border-color:#d67a0c;color:#fff;font-weight:bold}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;font-weight:bold;white-space:nowrap}
.pill.blue{background:#dbe8f8;color:#1f559f}.pill.high{background:var(--green-soft);color:#2a6f2a}
.pill.med{background:var(--amber-soft);color:var(--amber)}.pill.dec{background:var(--red-soft);color:var(--red)}
.pill.gray{background:#e7e7e7;color:#555}.pill.solid{background:var(--green);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-size:14px;color:#333}
.tabs button.on{border-bottom-color:var(--orange);font-weight:bold}
.tabs .n{color:var(--muted);font-weight:normal}
.card{border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:14px}
.card>h2{font-size:15px;font-weight:bold;padding:9px 12px;border-bottom:1px solid var(--orange);display:flex;align-items:center;gap:8px}
.card .bd{padding:12px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:7px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:9px;align-items:flex-start}
ul.clean li:last-child{border-bottom:0}
.ic{flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;vertical-align:-4px;place-items:center;font-size:11px;font-weight:bold;color:#fff;margin-top:1px}
.ic.ok{background:var(--green)}.ic.wait{background:#bbb}.ic.warn{background:#e39a16}.ic.bad{background:var(--red)}
.note{background:var(--req);border:1px solid #ecdf9b;padding:7px 10px;border-radius:2px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.note.blue{background:#eaf2fc;border-color:#c5d9f3}
.note.green{background:var(--green-soft);border-color:#b9dcb2}
.muted{color:var(--muted)} .r{text-align:right} .nw{white-space:nowrap}
.assist{color:var(--purple);font-weight:bold;white-space:nowrap}
table.v{border-collapse:collapse;width:100%}
table.v th{background:var(--head);text-align:left;font-size:12px;padding:7px 9px;border:1px solid var(--line);white-space:nowrap}
table.v td{padding:7px 9px;border:1px solid var(--line-soft);vertical-align:top}
table.v tr.sel td{background:var(--orange-soft)}
table.v tr.click{cursor:pointer} table.v tr.click:hover td{background:#f7f7f7} table.v tr.click.sel:hover td{background:var(--orange-soft)}
table.v tr.grp td{background:#f6f6f6;font-weight:bold;font-size:12px;color:#555;padding:5px 9px}
table.v tr.dim td{color:#999} table.v tr.strike td{color:#aaa;text-decoration:line-through}
table.v tr.exp td{background:#fafafa;padding:10px 12px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar .sp{margin-left:auto}
.kv{display:grid;grid-template-columns:160px 1fr;gap:5px 10px;margin:0}
.kv dt{color:var(--muted);text-align:right}.kv dd{margin:0}
.seg{display:inline-flex;border:1px solid #bdbdbd;border-radius:3px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 10px;border-right:1px solid #bdbdbd}
.seg button:last-child{border-right:0}.seg button.on{background:var(--blue);color:#fff}
code{font:12px Menlo,Consolas,monospace;background:#f3f3f3;border:1px solid var(--line-soft);padding:1px 4px;border-radius:2px}
pre.rule{font:12px/1.5 Menlo,Consolas,monospace;background:#fafafa;border:1px solid var(--line);padding:8px 10px;margin:8px 0 0;white-space:pre-wrap}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #bbb;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- suggestions ---------- */
.split{display:grid;grid-template-columns:minmax(420px,1fr) minmax(480px,1.2fr);gap:14px;align-items:start}
.dstat{font-weight:bold;font-size:12px;white-space:nowrap}
.dstat.accepted{color:var(--green)}.dstat.rejected{color:var(--red)}.dstat.pending{color:#999;font-weight:normal}
.detail h3{font-size:16px;font-weight:bold;margin-bottom:2px}
.sec{margin-top:14px}
.sec>label{display:block;font-weight:bold;font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.ba{display:grid;grid-template-columns:1fr 18px 1fr;gap:8px;align-items:stretch}
.ba>div{border:1px solid var(--line);border-radius:2px;padding:7px 9px;background:#fafafa}
.ba>div.after{background:var(--green-soft);border-color:#b9dcb2}
.ba>i{align-self:center;font-style:normal;color:#888}
.ba small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:2px}
.doc{border:1px solid #bbb;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:10px 12px;font-family:"Times New Roman",Times,serif;overflow-x:auto;margin-bottom:8px;font-size:14px}
.doc .cap{font-family:Arial,sans-serif;font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.doc table{border-collapse:collapse;font-size:13px}
.doc td,.doc th{border:1px solid #333;padding:3px 7px;text-align:center;white-space:nowrap;min-width:44px}
.doc th{text-align:left;font-weight:bold}
.doc td.hl,.doc mark{background:#fff1a8}.doc td.gap{background:#ffd9d2;outline:2px solid var(--red);outline-offset:-2px}
.doc td.it{font-style:italic;font-weight:bold}
.opts label{display:flex;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:2px;margin-bottom:6px;cursor:pointer;background:#fff}
.opts label.on{border-color:var(--blue);background:#eef4fc}
.opts small{display:block;color:var(--muted)}
.rec{font-size:10px;background:var(--blue);color:#fff;border-radius:2px;padding:0 5px;margin-left:6px;vertical-align:1px}
.decide{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.gate{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.gate:last-child{border-bottom:0} .gate b{display:block} .gate .go{margin-left:auto;white-space:nowrap}

/* ---------- schedule ---------- */
.schedwrap{overflow-x:auto;padding:0 90px 6px 0}
table.sched{border-collapse:collapse}
table.sched th.rot{height:128px;padding:0;vertical-align:bottom;font-weight:normal;min-width:38px;width:38px}
table.sched th.rot>div{width:38px;transform:translate(27px,0) rotate(-48deg);transform-origin:left bottom}
table.sched th.rot>div>span{display:block;width:158px;padding:3px 6px;border-bottom:1px solid #cfcfcf;white-space:nowrap;text-align:left;font-size:12px}
table.sched th.rot.accepted span{background:var(--green-soft);font-weight:bold;color:#2a6f2a;cursor:pointer}
table.sched th.rot.pending span{background:var(--amber-soft);font-weight:bold;color:var(--amber);cursor:pointer}
table.sched th.rot.rejected span{color:#aaa;text-decoration:line-through;cursor:pointer}
table.sched td,table.sched th.l{border:1px solid var(--line-soft);padding:5px 8px;height:30px}
table.sched th.l{text-align:left;background:var(--head);border-color:var(--line);font-size:12px;white-space:nowrap}
table.sched td.c{text-align:center;width:38px;min-width:38px;padding:0;font-size:12px}
table.sched td.name{white-space:nowrap}
table.sched td.accepted{background:var(--green-soft)}table.sched td.pending{background:var(--amber-soft)}
table.sched td.rejected{background:#f3f3f3;color:#bbb}
table.sched tr.meta td{background:#fafafa;color:#555;font-size:11px}
table.sched tr.meta td.accepted{background:var(--green-soft)}table.sched tr.meta td.pending{background:var(--amber-soft)}
table.sched td.gs{border-left:2px solid #999}
.chk{color:var(--green);font-weight:bold;font-size:14px}
.bolt{color:var(--orange);font-size:14px}
.plus{color:#fff;background:var(--green);border-radius:50%;display:inline-grid;place-items:center;width:17px;height:17px;font-size:13px;font-weight:bold;line-height:1}
.plus.pending{background:#e39a16}.plus.rejected{background:#ccc}
.legend{display:flex;gap:16px;font-size:12px;color:#555;align-items:center;flex-wrap:wrap}

/* ---------- subject timeline ---------- */
.tl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tl span{border:1px solid #ccc;border-radius:3px;padding:2px 6px;font-size:11px;background:#fff;white-space:nowrap}
.tl span.done{background:#eee;color:#888}
.tl span.new{background:var(--green-soft);border-color:#8cc481;color:#2a6f2a;font-weight:bold}
.tl span.soon{background:var(--amber-soft);border-color:#e39a16;color:var(--amber);font-weight:bold}
.tl span.skip{border-style:dashed;color:#aaa;text-decoration:line-through}
.tl span.here{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- modal / toast ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
.modal{background:#fff;width:520px;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-height:94vh;display:flex;flex-direction:column}
.modal.wide{width:min(1280px,96vw);height:92vh}
.modal h2{font-size:17px;padding:12px 16px;border-bottom:1px solid var(--orange);display:flex;align-items:center;gap:10px}
.modal h2 a{margin-left:auto;font-size:13px}
.modal .bd{padding:14px 16px;overflow:auto}
.modal .ft{padding:10px 16px;display:flex;justify-content:flex-end;gap:10px;align-items:center;border-top:1px solid var(--line-soft)}
.fld{margin-bottom:10px}.fld label{display:block;font-weight:bold;margin-bottom:3px}
.fld input,.fld select{width:100%;padding:6px 8px;border:1px solid #bbb;border-radius:2px}
.fld input.req{background:var(--req)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:3px;z-index:30;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.pdf{display:grid;grid-template-columns:270px 1fr;gap:0;flex:1;min-height:0}
.pdf .toc{border-right:1px solid var(--line);overflow:auto;background:var(--bg)}
.pdf .toc div{padding:9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-left:3px solid transparent}
.pdf .toc div:hover{background:#ececec}
.pdf .toc div.on{border-left-color:var(--orange);background:#fff}
.pdf .toc small{display:block;color:var(--muted)}
.pdf iframe{width:100%;height:100%;border:0;background:#777}
.pdfpage{height:calc(100vh - 250px);min-height:520px;border:1px solid var(--line)}

/* ---------- Site Connect skin ---------- */
.sc .nav{background:#fff;height:36px}
.sc .nav span{font-weight:bold;font-size:14px;color:#222}
.sc .layout{background:#f5f6f7;border-top:0}
.sc aside{width:262px;background:#fff;border-right:1px solid var(--line-soft);padding:10px 0}
.sc aside label{display:block;padding:0 12px;font-size:12px;color:#444;margin-bottom:3px}
.sc aside select{margin:0 12px;width:238px;padding:6px;border:1px solid #bbb;border-radius:3px;font-weight:bold}
.sc aside .proto{text-align:right;padding:9px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.sc aside .it{padding:11px 14px;font-size:14px;border-left:0;display:flex;align-items:center;gap:9px}
.sc aside .it.on{background:var(--orange-soft);color:#222;font-weight:bold}
.sc aside .it u{text-decoration:none;width:16px;text-align:center;color:#555}
.sc aside .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.sc main{padding:0 0 60px}
.sc .sctabs{background:#fff;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line)}
.sc .sctabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;font-size:14px}
.sc .sctabs button.on{border-bottom-color:var(--orange)}
.sc .sctabs .sp{margin-left:auto}
.sc .wrap{padding:16px 20px}
.sc .card{border-radius:6px;border-color:#e2e2e2;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sc .card>h2{border-bottom-color:var(--line-soft)}
.sc table.v th{background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 9px}
.sc table.v td{border:0;border-bottom:1px solid var(--line-soft);padding:11px 9px}
.ann{background:#fff;border:1px solid #e2e2e2;border-radius:6px;padding:13px 15px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px}
.ann:hover{border-color:var(--orange)}
.ann b{font-size:14px;display:block;margin-bottom:4px}
.ann small{margin-left:auto;white-space:nowrap;color:#444}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px}

/* ---------- landing ---------- */
.home{background:#f3f4f7;min-height:100vh}
.hero{background:var(--navy);color:#fff;padding:34px 0 70px}
.hw{width:1120px;margin:0 auto}
.hero h1{font-size:30px;font-weight:bold;margin:10px 0 8px}
.hero p{font-size:16px;color:#c7cfe2;max-width:760px;margin:0}
.hero .tag{font-size:11px;letter-spacing:1px;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:2px 8px;color:#cfd6e6}
.persp{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:-46px}
.pc{background:#fff;border:1px solid #dcdfe6;border-top:4px solid var(--orange);border-radius:5px;padding:18px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(20,30,60,.08)}
.pc .step{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.pc h2{font-size:19px;font-weight:bold;margin:2px 0 2px}
.pc .app{color:var(--muted);font-size:12px;margin-bottom:10px}
.pc ul{margin:0 0 14px;padding-left:18px;flex:1} .pc li{margin-bottom:5px}
.pc .st{border-top:1px solid var(--line-soft);padding-top:10px;margin-bottom:12px;font-size:12px}
.facts{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin:22px 0 40px}
.facts .card{margin:0}
.hero.auth{padding:44px 0 56px}
.authgrid{display:grid;grid-template-columns:1.15fr 430px;gap:56px;align-items:center}
.hero.auth h1{font-size:32px;line-height:1.25;margin:22px 0 12px}
.hero ul.hl{margin:16px 0;padding-left:18px;color:#dfe5f2;font-size:15px} .hero ul.hl li{margin-bottom:6px} .hero ul.hl b{color:#fff}
.authcard{background:#fff;color:var(--text);border-radius:6px;padding:16px 22px 20px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.authcard .lbl{display:block;font-weight:bold;margin-bottom:5px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.roles div{border:1px solid #c9c9c9;border-radius:4px;padding:8px 9px;cursor:pointer;background:#fafafa}
.roles div:hover{border-color:var(--orange)} .roles div.on{border:2px solid var(--orange);background:var(--orange-soft);padding:7px 8px}
.roles b{display:block;font-size:14px} .roles small{color:var(--muted);font-size:11px}
.btn.big{width:100%;padding:9px 12px;font-size:14px}
.hero .authcard p{color:var(--muted);font-size:12px}
.or{text-align:center;color:var(--muted);margin:8px 0;font-size:12px}
.sech{font-size:20px;font-weight:bold;margin:34px 0 14px}
.facts>div>.card{margin-bottom:14px}

/* ---------- readability ---------- */
